<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>展厅设备 3D AR 预览</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding-top: 60px; 
            background: #f4f4f9; 
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #1d1d1f; }
        p { color: #6e6e73; font-size: 15px; }
        .ar-btn {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            padding: 16px 32px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,113,227,0.3);
        }
        .ar-btn:active { background-color: #005bb5; }
    </style>
</head>
<body>

    <div class="container">
        <h2>工业展厅 3D 模型预览</h2>
        <p>点击下方按钮，即可在现实环境中以 1:1 比例查看设备 AR 效果</p>
        
        <!-- 核心苹果 AR 唤醒标签：href 里面已经填好了你的直链 -->
        <a rel="ar" href="https://raw.githubusercontent.com/yp04/Industrial-Room-AR/main/IndustrialRoom.usdz">
            <span class="ar-btn">📦 在 AR 中查看 (View in AR)</span>
        </a>
    </div>

</body>
</html>
