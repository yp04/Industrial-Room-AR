<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业展厅 3D AR 预览</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding-top: 80px; 
            background: #f4f4f9; 
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 40px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #1d1d1f; margin-bottom: 10px; }
        p { color: #6e6e73; font-size: 15px; margin-bottom: 30px; }
        
        /* 苹果标准的 AR 唤醒大按钮 */
        .ar-btn {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            padding: 18px 36px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(0,113,227,0.3);
        }
        .ar-btn:active { background-color: #005bb5; }
    </style>
</head>
<body>

    <div class="container">
        <h2>工业展厅 3D AR 预览</h2>
        <p>【测试模式】点击下方按钮，直接调起苹果原生 AR 视图</p>
        
        <!-- 苹果官方标准的 rel="ar" 唤醒链接 -->
        <a rel="ar" href="https://developer.apple.com/augmented-reality/quick-look/models/gramophone/Gramophone.usdz">
            <span class="ar-btn">📦 在 AR 中查看 (View in AR)</span>
        </a>
    </div>

</body>
</html>
