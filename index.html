<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业展厅 3D AR 预览</title>
    
    <!-- 引入谷歌官方的 3D/AR 模型查看组件库 -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: #f4f4f9; 
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #1d1d1f; margin-top: 10px; }
        p { color: #6e6e73; font-size: 14px; }
        
        /* 让 3D 模型直接在网页里显示并可旋转 */
        model-viewer {
            width: 100%;
            height: 400px;
            background-color: #f0f0f0;
            border-radius: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>工业展厅 3D 模型预览</h2>
        <p>【测试模式】正在使用苹果官方标准模型测试 AR 兼容性</p>
        
        <!-- model-viewer 标签：临时换成苹果官方测试模型 -->
        <model-viewer 
            src="https://developer.apple.com/augmented-reality/quick-look/models/gramophone/Gramophone.usdz"
            ios-src="https://developer.apple.com/augmented-reality/quick-look/models/gramophone/Gramophone.usdz"
            ar 
            ar-modes="quick-look webxr scene-viewer" 
            camera-controls 
            auto-rotate>
        </model-viewer>
    </div>

</body>
</html>
